services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sorteador-times-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DOCKER_DATABASE_URL:-mysql://sorteador_user:change_me@db:3306/sorteador_times}
      NEXT_PUBLIC_APP_URL: ${DOCKER_NEXT_PUBLIC_APP_URL:-http://localhost:8082}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change_this_to_a_long_random_secret}
      AUTH_ADMIN_NAME: ${AUTH_ADMIN_NAME:-Administrador}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@sorteador.local}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-change_me_admin_123}
    command: sh -c "npx prisma migrate deploy && node server.js"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads

  nginx:
    image: nginx:alpine
    container_name: sorteador-times-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: sorteador-times-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sorteador_times}
      MYSQL_USER: ${MYSQL_USER:-sorteador_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  uploads_data:
