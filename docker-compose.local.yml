services:
  app:
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:-mysql://sorteador_user:change_me@db:3306/sorteador_times}
      NEXT_PUBLIC_APP_URL: ${LOCAL_NEXT_PUBLIC_APP_URL:-http://localhost:8082}
      AUTH_JWT_SECRET: ${LOCAL_AUTH_JWT_SECRET:-change_this_to_a_long_random_secret}
      AUTH_ADMIN_EMAIL: ${LOCAL_AUTH_ADMIN_EMAIL:-admin@sorteador.local}
      AUTH_ADMIN_PASSWORD: ${LOCAL_AUTH_ADMIN_PASSWORD:-change_me_admin_123}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: sorteador-times-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sorteador_times}
      MYSQL_USER: ${MYSQL_USER:-sorteador_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
